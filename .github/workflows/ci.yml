name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, typecheck, test, and verify package
        run: npm run check

      - name: Confirm generated files are committed
        run: |
          set -e
          if ! git diff --exit-code -- dist pi-mcp.json || [ -n "$(git status --porcelain -- dist pi-mcp.json)" ]; then
            echo "dist/ or pi-mcp.json is stale: run npm run build and commit the result" >&2
            exit 1
          fi
