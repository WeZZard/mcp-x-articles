name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing (OIDC), for this job only
        run: |
          npm install --prefix "$RUNNER_TEMP/npm" npm@latest
          echo "$RUNNER_TEMP/npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json agrees with the tag
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "package.json is at $pkg_version, but tag $GITHUB_REF_NAME implies $tag_version" >&2
            exit 1
          fi

      - name: Build, typecheck, test, and verify package
        run: npm run check

      - name: Confirm generated files are up to date
        run: |
          set -e
          if ! git diff --exit-code -- dist pi-mcp.json || [ -n "$(git status --porcelain -- dist pi-mcp.json)" ]; then
            echo "dist/ or pi-mcp.json is stale: run npm run build and commit the result" >&2
            exit 1
          fi

      - name: Pack
        run: |
          set -e
          mkdir -p .release
          npm pack --pack-destination .release
          ls .release/*.tgz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "skip: release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag .release/*.tgz
          fi

      - name: Publish to npm
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          published_version=$(npm view "@wezzard/mcp-x-articles@$tag_version" version 2>/dev/null || true)
          if [ "$published_version" = "$tag_version" ]; then
            echo "skip: @wezzard/mcp-x-articles@$tag_version is already published"
          else
            npm publish .release/*.tgz --provenance --access public
          fi
